name: Sync Fork with Upstream

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check Supervisor version difference
        id: version_check
        run: |
          # 用 git ls-remote 直接读上游 tag，不走 GitHub API，避免限流导致定时任务失败
          latest_ver=$(git ls-remote --tags https://github.com/home-assistant/supervisor.git 'refs/tags/2026.*' \
            | awk '{print $2}' \
            | sed -e 's|refs/tags/||' -e 's|\^{}$||' \
            | sort -u -V | tail -1)
          last_ver=$(curl -s "https://${{ secrets.VER_URL }}/stable.json" | jq -r '.supervisor')
          echo "Latest version: $latest_ver"
          echo "Last version: $last_ver"
          if [ -z "$latest_ver" ]; then
            echo "::error::无法从上游仓库获取最新 supervisor 版本 tag，中止运行。"
            exit 1
          fi
          echo "latest_ver=$latest_ver" >> $GITHUB_ENV
          # 如果是定时任务（schedule）则判断版本是否一样，一样则退出；手工 workflow_dispatch 时，哪怕版本一样也不退出
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$latest_ver" = "$last_ver" ]; then
            echo "Versions are the same, skip workflow (scheduled run)."
            exit 1
          fi

      - name: Checkout your fork
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          # 保留 checkout 写入的 GITHUB_TOKEN 凭据供后续 git push 使用：
          # 本工作流只操作本仓库，GITHUB_TOKEN(contents:write)即可，无需 PAT
          persist-credentials: true

      - name: Set up Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # GitHub 部分边缘节点缓存了本仓库历史迁移的 301 重定向，会把 push 打到
          # 错误路径；HTTP/1.1 + 推送重试规避
          git config --global http.version HTTP/1.1

      # 用 merge（而不是 reset）同步上游：本地自定义内容不会被冲掉，上游更新正常并入。
      # 只有双方改到同一行才会冲突，此时任务失败，需要手动合并后重跑。
      - name: Sync main with upstream (merge)
        run: |
          git remote add upstream https://github.com/home-assistant/supervisor.git
          git fetch upstream --tags --force
          git checkout main
          if ! git merge upstream/main --no-edit; then
            echo "::error::合并上游 main 发生冲突，需要手动解决后推送。"
            git status --short
            exit 1
          fi
          for i in 1 2 3 4 5; do
            if git push origin main; then
              break
            fi
            if [ "$i" = "5" ]; then
              echo "::error::main 推送重试 5 次仍失败。"
              exit 1
            fi
            echo "Push attempt $i failed, retrying in 30s..."
            sleep 30
          done

      # 往最新 release tag 注入 CN 版 builder.yml，使 tag 上可以直接手动 dispatch 构建
      - name: Inject CN workflow into release tag
        run: |
          git checkout -B temp-$latest_ver $latest_ver
          git checkout main -- .github/workflows/builder.yml
          git add .github/workflows/builder.yml
          git commit -m "Add CN build workflow to tag $latest_ver" || echo "No changes to commit"
          git tag -f $latest_ver
          for i in 1 2 3 4 5; do
            if git push origin "$latest_ver" --force; then
              exit 0
            fi
            echo "Push attempt $i failed, retrying in 30s..."
            sleep 30
          done
          echo "::error::tag 推送重试 5 次仍失败。"
          exit 1

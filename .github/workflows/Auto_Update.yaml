name: Sync Fork with Upstream

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check Supervisor version difference
        id: version_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          latest_ver=$(curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/home-assistant/supervisor/releases/latest | jq -r '.tag_name')
          last_ver=$(curl -s "https://${{ secrets.VER_URL }}/stable.json" | jq -r '.supervisor')
          echo "Latest version: $latest_ver"
          echo "Last version: $last_ver"
          if [ -z "$latest_ver" ] || [ "$latest_ver" = "null" ]; then
            echo "::error::无法从 GitHub API 获取最新 supervisor 版本（返回 '$latest_ver'），可能是被限流或 API 异常，中止运行。"
            exit 1
          fi
          echo "latest_ver=$latest_ver" >> $GITHUB_ENV
          # 如果是定时任务（schedule）则判断版本是否一样，一样则退出；手工 workflow_dispatch 时，哪怕版本一样也不退出
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$latest_ver" = "$last_ver" ]; then
            echo "Versions are the same, skip workflow (scheduled run)."
            exit 1
          fi

      - name: Checkout your fork
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Git and PAT remote
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://${GH_PAT}@github.com/ha-china/supervisor.git

      # 用 merge（而不是 reset）同步上游：本地自定义内容不会被冲掉，上游更新正常并入。
      # 只有双方改到同一行才会冲突，此时任务失败，需要手动合并后重跑。
      - name: Sync main with upstream (merge)
        run: |
          git remote add upstream https://github.com/home-assistant/supervisor.git
          git fetch upstream --tags
          git checkout main
          if ! git merge upstream/main --no-edit; then
            echo "::error::合并上游 main 发生冲突，需要手动解决后推送。"
            git status --short
            exit 1
          fi
          git push origin main

      # 镜像上游新出现的 release tag（不做注入，注入在下一步单独处理）
      - name: Sync upstream tags
        run: git push origin --tags

      # 往最新 release tag 注入 CN 版 builder.yml，使 tag 上可以直接手动 dispatch 构建
      - name: Inject CN workflow into release tag
        run: |
          git checkout -B temp-$latest_ver $latest_ver
          git checkout main -- .github/workflows/builder.yml
          git add .github/workflows/builder.yml
          git commit -m "Add CN build workflow to tag $latest_ver" || echo "No changes to commit"
          git tag -f $latest_ver
          git push origin $latest_ver --force
